name: One-time backend test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-backend-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check live GitHub Pages
        run: |
          set -euo pipefail
          curl -fsSL 'https://minnesandstra.github.io/athena-h2-voting/' | grep -q 'AthenA H2-O'
          curl -fsSL 'https://minnesandstra.github.io/athena-h2-voting/config.js' | grep -q 'AKfycbwzbdhRwuh5mukkisno3m90AUyxcHqA3yw9PKOh7HheZKKGYdMHuR2iRA9pVFu1utXK'

      - name: Check Apps Script config
        run: |
          set -euo pipefail
          API='https://script.google.com/macros/s/AKfycbwzbdhRwuh5mukkisno3m90AUyxcHqA3yw9PKOh7HheZKKGYdMHuR2iRA9pVFu1utXK/exec'
          curl -fsSLG "$API" \
            --data-urlencode 'action=config' \
            --data-urlencode 'matchId=2026-09-06-ushc-home' \
            -o config.json
          cat config.json
          grep -q '"status":"open"' config.json
          grep -q 'Adriaan Davids' config.json
          grep -q 'Twan van den Berg' config.json

      - name: Send one test vote
        run: |
          set -euo pipefail
          API='https://script.google.com/macros/s/AKfycbwzbdhRwuh5mukkisno3m90AUyxcHqA3yw9PKOh7HheZKKGYdMHuR2iRA9pVFu1utXK/exec'
          PAYLOAD='{"submissionId":"chatgpt-e2e-test-20260903","matchId":"2026-09-06-ushc-home","browserId":"chatgpt-e2e-browser-20260903","voterCode":"","motm":"Adriaan Davids","dotd":"Brent van den Bongaardt","sexyMoment":"TEST - end-to-end koppeling","clientTimestamp":"2026-09-03T12:00:00+02:00"}'
          RESPONSE=$(curl -fsSL "$API" --data-urlencode "payload=$PAYLOAD")
          printf '%s\n' "$RESPONSE"
          test "$RESPONSE" = 'ok' || test "$RESPONSE" = 'duplicate receipt'
